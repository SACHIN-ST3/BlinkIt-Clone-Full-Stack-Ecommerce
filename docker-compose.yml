services:

  mongo:
    image: mongo:7
    container_name: blinkit-mongo

    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - blinkit-network


  backend:
    build:
      context: ./server
      dockerfile: Dockerfile

    container_name: blinkit-backend

    restart: unless-stopped

    ports:
      - "8080:8080"

    env_file:
      - .env.compose

    depends_on:
      - mongo

    networks:
      - blinkit-network


  frontend:
    build:
      context: ./client
      dockerfile: Dockerfile

    container_name: blinkit-frontend

    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend

    networks:
      - blinkit-network


volumes:

  mongodb_data:


networks:

  blinkit-network:
    driver: bridge
